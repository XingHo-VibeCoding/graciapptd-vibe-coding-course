<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vibe-coding-course</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #646a73;
      --accent: #3370ff;
      --border: #e5e6eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      color: var(--accent);
      background: rgba(51, 112, 255, 0.08);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; letter-spacing: -0.5px; }
    p  { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
    .meta {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .meta span { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Day 2 · 占位页</div>
    <h1>vibe-coding-course</h1>
    <p>这是我的第一个 vibe coding 练习项目。</p>
    <p>页面现在只是占位，真正的功能第 7 天开始做。</p>
    <div class="meta">
      项目工作区：<span>C:\Users\Lenovo\Desktop\vibe-coding-course</span>
    </div>
  </main>
</body>
</html>
